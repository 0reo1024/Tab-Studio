[package]
name = "tabstudio-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tab Studio's document model and edit operations (plan P3), native and WASM"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "s"
lto = true
