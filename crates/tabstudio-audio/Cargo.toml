[package]
name = "tabstudio-audio"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tab Studio native audio engine (plan P2)"

[dependencies]
cpal = "0.18"
lewton = "0.10"
libloading = "0.8"
realfft = "3"
rtrb = "0.4"
tabstudio-fxlink = { path = "../tabstudio-fxlink" }
wasmtime = { version = "49", default-features = false, features = ["cranelift", "runtime", "std", "gc", "gc-null"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading"] }

[dev-dependencies]

[profile.dev.package."*"]
opt-level = 2
