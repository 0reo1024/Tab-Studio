[package]
name = "tab-studio"
version = "1.3.0"
description = "Tab Studio (Tauri shell)"
authors = ["Tab Studio contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "tab_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Without "compression": bundled assets (42MB soundfont) are served without per-request
# brotli decoding; the exe is larger but the score loads about a second sooner.
tauri = { version = "2.12.1", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "x11", "dbus"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
flate2 = "1"
rusty-leveldb = "3"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[dev-dependencies]
tempfile = "3"
