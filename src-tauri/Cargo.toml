[package]
name = "tab-studio"
version = "1.3.0"
description = "Tab Studio (Tauri shell)"
authors = ["Tab Studio contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.90"
# The external effect host (tabstudio-fx-host) is a second binary of this package.
default-run = "tab-studio"

[lib]
name = "tab_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Instrument input through Steinberg ASIO (needs third_party/asio_sdk and LLVM; see
# .cargo/config.toml and docs/live-input.md). Build without it: --no-default-features.
default = ["asio"]
asio = ["tabstudio-audio/asio"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Without "compression": bundled assets (42MB soundfont) are served without per-request
# brotli decoding; the exe is larger but the score loads about a second sooner.
tauri = { version = "2.12.1", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "x11", "dbus"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
flate2 = "1"
tabstudio-audio = { path = "../crates/tabstudio-audio" }
tabstudio-fxlink = { path = "../crates/tabstudio-fxlink" }
rusty-leveldb = "3"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
tabstudio-fx-host = { path = "../crates/tabstudio-fx-host" }
windows-core = "0.62"

[dev-dependencies]
tempfile = "3"

# Debug builds still optimize dependencies: the audio engine (synth, SF3 decoding) is
# unusably slow unoptimized (first sound font conversion took 17 s).
[profile.dev.package."*"]
opt-level = 2
