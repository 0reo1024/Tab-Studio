name: Build installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installers:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run prepare:assets
      - run: pnpm test
      - run: pnpm run dist:win
        if: runner.os == 'Windows'
      - run: pnpm run dist:mac
        if: runner.os == 'macOS'
      - uses: actions/upload-artifact@v4
        with:
          name: Tab-Studio-${{ runner.os }}
          path: |
            release/**/*Setup.exe
            release/**/*.dmg
            release/**/*mac-*.zip
          if-no-files-found: error
